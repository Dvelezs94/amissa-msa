name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    name: Detect mobile-relevant changes
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.detect.outputs.mobile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect mobile paths
        id: detect
        run: |
          set -euo pipefail
          # Keep globs in sync with lib/ci-mobile-paths.ts (mobile/**, .github/workflows/cicd.yml)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            FILES=$(git diff --name-only "${BASE}...${HEAD}")
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "mobile=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            FILES=$(git diff --name-only "$BASE" "$HEAD")
          fi

          MOBILE=$(printf '%s\n' "$FILES" | node --experimental-strip-types scripts/ci-has-mobile-changes.ts)
          echo "mobile=${MOBILE}" >> "$GITHUB_OUTPUT"

  build:
    name: Test and validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Create CI .env for Docker Compose
        run: |
          cat > .env <<EOF
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          S3_ENDPOINT=${{ secrets.S3_ENDPOINT }}
          S3_REGION=us-east-1
          S3_BUCKET=${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID=${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY=${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_PUBLIC_BASE_URL=https://${{ secrets.S3_BUCKET }}.s3.us-east-1.amazonaws.com
          EOF

      - name: Run full Docker Compose CI flow
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          docker compose up -d --build --remove-orphans
          docker compose run --rm web npm run db:push

      - name: Tear down Docker Compose
        if: always()
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          docker compose down -v --remove-orphans

  mobile-android:
    name: Build Android APK (Expo)
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.mobile == 'true'
    env:
      EXPO_PUBLIC_API_HOST: https://msa.amissa.mx
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Run mobile unit tests
        run: npm test
        working-directory: mobile

      - name: Stamp Android version from day + commit
        run: node --experimental-strip-types scripts/stamp-android-version.ts
        working-directory: mobile
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Generate Android project from Expo config
        run: npx expo prebuild --platform android --non-interactive
        working-directory: mobile

      - name: Build release APK
        run: chmod +x ./gradlew && ./gradlew assembleRelease
        working-directory: mobile/android

      - name: Prepare APK output folders
        run: |
          mkdir -p downloads/android
          mkdir -p /downloads/android || true

      - name: Collect APK in downloads folder
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk downloads/android/msa-release.apk
          cp mobile/android/app/build/outputs/apk/release/app-release.apk /downloads/android/msa-release.apk || true

      - name: Create Android update manifest
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const stampedPath = path.join(process.cwd(), "mobile/.build-version.json");
          const appConfig = JSON.parse(fs.readFileSync(path.join(process.cwd(), "mobile/app.json"), "utf8"));
          const stamped = fs.existsSync(stampedPath)
            ? JSON.parse(fs.readFileSync(stampedPath, "utf8"))
            : null;
          const versionName = String(
            stamped?.versionName ?? appConfig?.expo?.version ?? "0.0.0"
          );
          const versionCode = Number(
            stamped?.versionCode ?? appConfig?.expo?.android?.versionCode ?? 0
          );
          const manifest = {
            versionName,
            versionCode: Number.isFinite(versionCode) ? versionCode : 0,
            apkUrl: "/downloads/android/msa-release.apk",
            required: false,
            notes: `Nueva version ${versionName}.`,
          };
          fs.writeFileSync(
            path.join(process.cwd(), "downloads/android/version.json"),
            `${JSON.stringify(manifest, null, 2)}\n`,
            "utf8"
          );
          EOF

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: downloads/android
          if-no-files-found: error

  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    needs: [build, mobile-android]
    if: >
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.build.result == 'success' &&
      (needs.mobile-android.result == 'success' || needs.mobile-android.result == 'skipped')
    environment: production
    env:
      DEPLOY_HOST: 5.78.189.24
      DEPLOY_PORT: 22
      DEPLOY_USER: deploy
      DEPLOY_PATH: /var/www/msa
      DEPLOY_APK_PATH: /var/www/msa/downloads/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android APK artifact
        if: needs.mobile-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: downloads/android

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Copy project files to server
        run: |
          rsync -az --delete \
            --exclude ".git/" \
            --exclude "node_modules/" \
            --exclude ".next/" \
            --exclude ".env" \
            --exclude "coverage/" \
            --exclude "public/uploads/" \
            --exclude "downloads/" \
            -e "ssh -p ${DEPLOY_PORT:-22}" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Copy Android APK to server downloads route
        if: needs.mobile-android.result == 'success'
        run: |
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${DEPLOY_APK_PATH}'"
          rsync -az \
            -e "ssh -p ${DEPLOY_PORT:-22}" \
            downloads/android/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_APK_PATH}/"

      - name: Restart Docker Compose and run migrations
        run: |
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" <<EOF
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          cat > .env <<ENVFILE
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          S3_ENDPOINT=${{ secrets.S3_ENDPOINT }}
          S3_REGION=us-east-1
          S3_BUCKET=${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID=${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY=${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_PUBLIC_BASE_URL=https://${{ secrets.S3_BUCKET }}.s3.us-east-1.amazonaws.com
          ENVFILE
          docker compose up -d --build --remove-orphans
          docker compose run --rm web npm run db:push
          EOF
